ckground:#e9eced;position:relative;overflow:hidden;display:flex;align-items:center}.deck-visual img{max-width:100%;width:100%;height:auto;cursor:zoom-in;transition:transform .2s}.plan-scale{position:absolute;bottom:12px;left:12px;font-size:9px;color:#304456;background:#f0f4f6da;padding:8px 10px;letter-spacing:1px}.deck-info{padding:34px 26px;background:#102e3e}.deck-info h2{font-family:Georgia,serif;font-weight:400;font-size:36px;line-height:1.1;margin:17px 0}.datum{color:var(--gold);font-size:29px}.datum small{display:block;font-size:9px;letter-spacing:1.1px;color:#839ba8;margin:3px 0 10px}.deck-info p{color:#c0cbd0;font-size:13px}.rooms{margin:20px 0 23px;border-top:1px solid #325365}.rooms>div{display:flex;gap:15px;font-size:12px;color:#cfdee4;padding:9px 0;border-bottom:1px solid #2d4a5b}.rooms span{color:var(--gold);font-size:10px}.access{font-size:9px;letter-spacing:1.5px;color:var(--gold)}.access b{display:block;font-size:12px;letter-spacing:0;color:#e1ecec;margin-top:7px}.mini-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.fabrication{max-width:1130px}.scale-callout{margin:28px 0 21px;border-left:3px solid var(--gold);padding:8px 20px;background:#102e3f;display:flex;align-items:center;gap:22px}.scale-callout span{font-size:10px;letter-spacing:1.5px;color:#c0ccd1}.scale-callout b{font-family:Georgia,serif;font-weight:normal;font-size:35px}.scale-callout b em{font-size:20px;font-style:normal;color:#7d919c}.scale-callout p{font-size:11px;color:#bacbd3;max-width:260px}.processes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.process{border:1px solid #365c70;background:#103142;min-height:250px;color:#e9f0f2;text-align:left;padding:18px 15px;display:flex;flex-direction:column;gap:22px;position:relative}.process:not(:last-child):after{content:'›';position:absolute;right:-11px;top:47%;font-size:24px;color:#d2b186;z-index:2}.process-id{font-family:Georgia,serif;font-size:32px;color:var(--gold)}.process strong{font-family: </style><link rel="stylesheet" href="src/presentation-polish.css"><link rel="stylesheet" href="src/systems.css"></head><body><div id="app"></div><script>const slides=[{"id":"vision","label":"The Vision","section":"INTRODUCTION","tag":"01 / THE VESSEL","title":"A farther horizon.","subtitle":"68 meters / approximately 223 feet","body":"A 68-meter ocean-going expedition ketch: serious bluewater engineering with the warmth, restraint and confidence of a private maritime residence.","image":"hero-full-greece.webp","layout":"hero","notes":["68 m provisional design length","True ketch / mainmast forward / mizzen aft","Performance and stability subject to naval-engineering validation"]},{"id":"profile","label":"Full Profile","section":"EXTERIOR","tag":"02 / EXTERIOR","title":"The long view.","subtitle":"68 meters. One continuous line.","body":"Deep midnight-blue steel hull, restrained ivory superstructure, clear teak working decks, and a disciplined two-mast profile.","image":"profile-full-greece.webp","layout":"wide","notes":["Full-height masts retained in reference imagery","Sheer, deckhouse and rig geometry are currently concept-only"]},{"id":"architecture","label":"Design Language","section":"EXTERIOR","tag":"03 / ARCHITECTURE","title":"Heritage, refined.","subtitle":"Oyster discipline. Beneteau clarity.","body":"Warm joinery and weather-protected spaces meet practical circulation, visibility and robust long-range engineering.","image":"hero-alt-greece.webp","layout":"split","notes":["Oyster / Beneteau used as precedent, not identity","Structural and functional layouts remain provisional"]},{"id":"rig","label":"Ketch Rig","section":"EXTERIOR","tag":"04 / SAIL PLAN","title":"A working sail plan.","subtitle":"Two masts, multiple configurations.","body":"A carbon mainmast and smaller aft mizzen provide distributed sail area. Sail loads, reefing geometry and aero-hydrodynamic performance are not yet approved.","image":"sails-luxury.webp","layout":"split","notes":["Keel-up draft target 4.8–5.0 m","Keel-down draft target 7.2–7.8 m"]},{"id":"bridge","label":"Bridge Deck","section":"LIVING","tag":"05 / BRIDGE","title":"A captain’s library.","subtitle":"Walnut, leather, brass and instrument glass.","body":"The bridge is a working navigation platform with the warmth of a private library. Panoramic sightlines, chart-work, deep leather chairs and quiet spaces for the passage.","image":"bridge-luxury.webp","layout":"split","notes":["Navigation remains safety-critical","Material fire and restraint requirements apply"]},{"id":"commander","label":"Commander Lookout","section":"LIVING","tag":"06 / COMMANDER","title":"Look forward.","subtitle":"The observation salon beneath the bridge.","body":"A protected panoramic forward room for reading, conversation and passage-watching. A central circulation spine leads aft toward the Lido.","image":"lookout-luxury.webp","layout":"split","notes":["Forward below bridge","Mag-rail concept only: Commander ↔ Main/Master"]},{"id":"lido","label":"Aft Lido","section":"LIVING","tag":"07 / LIDO","title":"Open sea. Open air.","subtitle":"Aft dining, bar, terrace and pool.","body":"The Lido occupies the aft portion of the Commander level, balancing outdoor hospitality with safe deck circulation and weather protection.","image":"lido-luxury.webp","layout":"split","notes":["Pool mass / free-surface / drains to be engineered","Aft deck structure and mizzen interface unresolved"]},{"id":"salon","label":"Main Salon","section":"LIVING","tag":"08 / MAIN / MASTER","title":"A place to gather.","subtitle":"An ocean-facing residential salon.","body":"Soft ivory upholstery, restrained bronze details and timber surfaces create a residential atmosphere with sea views and secure, integrated furniture.","image":"salon-luxury.webp","layout":"split","notes":["Main/Master at +3.35 m nominal deck datum","Main-to-Tween via protected stairs"]},{"id":"master","label":"Master Suite","section":"LIVING","tag":"09 / OWNER ACCOMMODATION","title":"Private sanctuary.","subtitle":"A quiet space within the ship.","body":"A warm owner’s suite with generous stowage, privacy and marine-secured furnishings. Volume and glazing must reconcile with the final hull and bulkheads.","image":"master-luxury.webp","layout":"split","notes":["Cabin partitions not construction-approved","Materials and furnishings shown as visual design intent"]},{"id":"guests","label":"Guest Suites","section":"LIVING","tag":"10 / GUESTS","title":"Hospitality at sea.","subtitle":"Guest comfort with offshore discipline.","body":"Flexible suites use natural finishes, controllable light and carefully positioned stowage, while respecting hull curvature and protected exits.","image":"guest-luxury.webp","layout":"split","notes":["Guest and crew circulation to be separated","Tween deck +0.85 m provisional"]},{"id":"galley","label":"Galley & Bars","section":"OPERATIONS","tag":"11 / HOSPITALITY","title":"Behind every gathering.","subtitle":"A true professional galley.","body":"Chef-grade preparation space and cold storage support long voyages. Bars and food service are linked through efficient, secure routes.","image":"galley-luxury.webp","layout":"split","notes":["60-day provisioning requirement under study","Cold chain and fire boundaries not yet fixed"]},{"id":"crew","label":"Crew & Laundry","section":"OPERATIONS","tag":"12 / SERVICE","title":"Quietly capable.","subtitle":"The systems behind the experience.","body":"Crew facilities, laundry, stores, a workshop and maintenance routes support practical independence and humane long-range operation.","image":"crew-luxury.webp","layout":"split","notes":["Tween deck is a real accommodation level","Tank level primarily technical access and tankage"]},{"id":"engineering","label":"Mechanical Systems","section":"OPERATIONS","tag":"13 / ENGINEERING","title":"Independence by design.","subtitle":"Serviceability is luxury.","body":"Protected hybrid-ready propulsion, electrical distribution, water production, bilges, fuel treatment and maintenance clearance form the operational core.","image":"mechanical-luxury.webp","layout":"split","notes":["Power / fuel and water budgets require reconciliation","Battery enclosure certification pathway remains open"]},{"id":"plans","label":"Deck Plans","section":"TECHNICAL","tag":"14 / ARRANGEMENT","title":"Five connected levels.","subtitle":"Architecture, properly arranged.","body":"Bridge above Commander/Lido, Main/Master, Tween and Tank. The vertical travel strategy separates guest hospitality from technical access.","image":"deck-plans.png","layout":"technical","notes":["Plans are early block arrangements, not dimensioned rooms","Commander ↔ Main elevator; lower decks by stairs"]},{"id":"sections","label":"Longitudinal Section","section":"TECHNICAL","tag":"15 / SECTION","title":"Within the hull.","subtitle":"Five levels, one structural system.","body":"Deck elevations, mast foundations, the lifting keel envelope and watertight subdivision must be reconciled with the 68-meter immersed hull.","image":"long-section.png","layout":"technical","notes":["Bridge +9.30 / Commander +6.60 / Main +3.35 m","Tween +0.85 / Tank −1.50 m relative to DWL"]},{"id":"hydro","label":"Hull & Buoyancy","section":"TECHNICAL","tag":"16 / NAVAL ARCHITECTURE","title":"The numbers beneath.","subtitle":"A model, not yet a verdict.","body":"The current canoe-body model estimates 786 m³ at the design waterline, equivalent to approximately 806 tonnes displaced in seawater before appendage contributions.","image":"hydrostatics.png","layout":"technical","notes":["68 m LOA · 62 m waterline · 12.1 m beam","No validated GZ curve or full mass balance yet"]},{"id":"manufacturing","label":"Steel Fabrication","section":"FABRICATION","tag":"17 / HULL PRODUCTION","title":"From plate to vessel.","subtitle":"CNC fabrication, without shortcuts.","body":"The steel hull is developed from approved scantlings and faired plating into traceable cut parts. CNC plasma supports repeatable fabrication; plate forming, welding control and inspection remain essential skilled operations.","image":"transverse.png","layout":"technical","notes":["P68 is 68 meters, approximately 223 feet—not a 68-foot, 40-tonne kit boat","Plate developments, weld schedules and nesting require naval architect and class review"]},{"id":"workflow","label":"Digital Cutting","section":"FABRICATION","tag":"18 / DIGITAL MANUFACTURING","title":"A verifiable fabrication chain.","subtitle":"From geometry to traceable steel.","body":"Approved hull model → developed plating and structural details → material and thickness allocation → CNC nesting → cut IDs / fit-up → verified welds → as-built laser scans. Tab-and-slot may aid selected internal framing but does not eliminate jigs or dimensional control.","image":"elevation.png","layout":"technical","notes":["Nested file ≠ permission or approval to construct","Thermal distortion, kerf, cut compensation and forming allowances must be proven in shop trials"]},{"id":"source","label":"Open-Source Release","section":"OPEN SOURCE","tag":"19 / PUBLIC RELEASE","title":"Pay it forward.","subtitle":"A reproducible design, responsibly released.","body":"Publish original models, attributed sources, cutting geometries, BOM, revision history, corrections and test evidence in a versioned repository after rights clearance and engineering review. Distribute build files alongside conspicuous use limits and verification requirements.","image":"hydrostatics.png","layout":"technical","notes":["Open license governs reuse; it is not certification","Distinguish concept assets, reviewed production files and as-built validation"]},{"id":"crowd","label":"Community Milestones","section":"OPEN SOURCE","tag":"20 / COMMUNITY FUNDING","title":"Fund the learning curve.","subtitle":"Milestones measured by evidence.","body":"Crowdfunding can support design verification, first-article cutting tests, steel framing, plating and inspections. The campaign must plainly disclose that the project builds a privately owned vessel as well as publicly released engineering knowledge.","image":"hero-alt-greece.webp","layout":"split","notes":["Backer benefits and release triggers stated up front","No guaranteed seaworthiness or independent build approval"]},{"id":"verification","label":"Validation Plan","section":"OPEN SOURCE","tag":"21 / VERIFICATION","title":"Document everything.","subtitle":"From error log to seaworthy evidence.","body":"Log input geometry, plate yield, dimensional inspection, welding and nondestructive examination results, construction changes, inclining and sea trials. Archive signed review gates so future builders can separate verified data from assumptions.","image":"long-section.png","layout":"technical","notes":["External naval architect / class / flag scrutiny where required","A successful prototype does not certify derived vessels"]},{"id":"outlook","label":"Roadmap","section":"OPEN SOURCE","tag":"22 / THE ROAD AHEAD","title":"Built once. Learned from forever.","subtitle":"Contribute to a community of builders.","body":"P68-KETCH-G focuses on coordinated general arrangement, weight and structure. Subsequent releases should progress through steel shop trials, approved manufacturing files, construction evidence and independent performance verification.","image":"profile-full-greece.webp","layout":"wide","notes":["Next gate: reconciled weight register + structure + deck volume","Only professionally approved production files should be represented as suitable for cutting"]}];

ined, so backup capacity cannot be sized.","Emergency switchboard location is not placed."],"related_decks":[]},{"id":"electrical-distribution","domain":"power-propulsion","name":"Electrical distribution","status":"concept","safety_critical":true,"public_release":false,"summary":"Main switchboards, transformers, protection and distribution to hotel and technical loads. Bus voltage and layout depend on the propulsion decision.","approval_status":"Not reviewed. Requires electrical engineering and classification review before any design decision.","key_parameters":[{"label":"Main bus voltage","value":"Not selected (600 V target)","basis":"target"},{"label":"Switchboard arrangement","value":"To be determined","basis":"tbd"},{"label":"Protection and earthing scheme","value":"To be determined","basis":"tbd"}],"risks":["Bus voltage is unresolved, which blocks the switchboard and protection design.","Switchboard and cable routes are not placed on the general arrangement."],"related_decks":[]},{"id":"led-lighting","domain":"interiors","name":"LED lighting","status":"concept","safety_critical":false,"public_release":true,"summary":"Interior and exterior LED lighting for living spaces, circulation, navigation lights and deck work. Control zones and fixtures are not yet specified.","approval_status":"Not reviewed. Requires electrical and navigation-light compliance review before any selection.","key_parameters":[{"label":"Lighting zones","value":"To be determined","basis":"tbd"},{"label":"Control system","value":"To be determined","basis":"tbd"},{"label":"Navigation lights","value":"Must meet applicable rules, not yet specified","basis":"tbd"}],"risks":["Navigation light arrangement must meet applicable rules and is not designed.","Power demand of lighting has not been added to the energy budget."],"related_decks":[]},{"id":"water-makers","domain":"fluids-fuel","name":"Water makers (desalination)","status":"concept","safety_critical":false,"public_release":true,"summary":"Seawa ","basis":"tbd"},{"label":"Alarm integration","value":"To be determined","basis":"tbd"}],"risks":["Emergency notification must reach every level and is not yet designed."],"related_decks":[]},{"id":"command-and-control","domain":"navigation-comms","name":"Command and control","status":"concept","safety_critical":true,"public_release":false,"summary":"Integrated control of propulsion, power, alarms and systems status from the bridge, with local control at machinery.","approval_status":"Not reviewed. Requires control-system and classification review before any design decision.","key_parameters":[{"label":"Control architecture","value":"To be determined","basis":"tbd"},{"label":"Redundancy","value":"To be determined","basis":"tbd"},{"label":"Local control points","value":"To be determined","basis":"tbd"}],"risks":["Control redundancy is not defined, so failure modes are not analysed.","Software and cybersecurity requirements are not written."],"related_decks":["Bridge","Commander / Lido","Tank / Technical"]},{"id":"av-media","domain":"navigation-comms","name":"Audio-visual and media systems","status":"concept","safety_critical":false,"public_release":true,"summary":"Audio, video and media distribution across salons, cabins and the lido, with central control.","approval_status":"Not reviewed. Requires electrical and acoustic review before any selection.","key_parameters":[{"label":"Media zones","value":"To be determined","basis":"tbd"},{"label":"Central control","value":"To be determined","basis":"tbd"}],"risks":["Equipment racks and cable routes are not placed."],"related_decks":[]},{"id":"wifi-network","domain":"navigation-comms","name":"Wifi and onboard network","status":"concept","safety_critical":false,"public_release":false,"summary":"Onboard wireless and wired network for guests, crew and systems, separated by security zone. Design is not started.","approval_status":"Not designed. Requires network security review before any deployment.","key_parameters":[{"label":"Network zones","value":"Guest, crew and systems (to be defined)","basis":"tbd"},{"label":"Access points","value":"To be determined","basis":"tbd"}],"risks":["Systems and guest networks must be separated; not yet designed.","Network details are withheld from public release."],"related_decks":[]},{"id":"premise-security","domain":"security-operations","name":"Premise security","status":"concept","safety_critical":false,"public_release":false,"summary":"Physical security for the vessel, including perimeter, cameras, alarms and protected areas. Layout is not designed.","approval_status":"Not designed. Requires security-consultant review. Details are withheld from public release.","key_parameters":[{"label":"Protected areas","value":"To be determined","basis":"tbd"},{"label":"Surveillance coverage","value":"To be determined","basis":"tbd"}],"risks":["Security layout is not designed and is withheld from public release."],"related_decks":[]},{"id":"keycard-access","domain":"security-operations","name":"Keycard access control","status":"concept","safety_critical":false,"public_release":false,"summary":"Keycard access to cabins, technical spaces and restricted areas, with logging. Technology and zones are not selected.","approval_status":"Not designed. Requires security and life-safety review, including egress, before any selection. Withheld from public release.","key_parameters":[{"label":"Access zones","value":"To be determined","basis":"tbd"},{"label":"Egress override","value":"Must not block emergency escape","basis":"target"}],"risks":["Access must never block emergency egress; the failure mode is not designed.","Specifications are withheld from public release."],"related_decks":[]},{"id":"policies-procedures","domain":"security-operations","name":"Policies and procedures","status":"concept","safety_critical":false,"public_release":true,"summary":"Written operating policies and procedures for safety, environmental management, guests and crew. None has been drafted yet.","approval_status":"Not drafted. Requires flag-state and class review once written.","key_parameters":[{"label":"Policy set","value":"Not yet drafted","basis":"tbd"},{"label":"Document control","value":"Revision history to be set up","basis":"tbd"}],"risks":["No policies exist yet, so operational assumptions are not recorded."],"related_decks":[]},{"id":"checklist-system","domain":"security-operations","name":"Checklist and procedure system","status":"concept","safety_critical":false,"public_release":true,"summary":"Structured checklists for operations and maintenance, linked to each system. Draft checklists are stored in checklists.json and are not approved for use.","approval_status":"Draft only. Each checklist requires an approved procedure before use on a vessel.","key_parameters":[{"label":"Checklists drafted","value":"See the checklists on each system","basis":"model"},{"label":"Approval workflow","value":"To be defined","basis":"tbd"}],"risks":["Draft checklists must not be used for operations until approved."],"related_decks":[]},{"id":"onboard-automation","domain":"security-operations","name":"Onboard automation","status":"concept","safety_critical":true,"public_release":false,"summary":"Automation of routine ship functions such as monitoring, alarms and scheduled tasks. Scope and control authority are not yet defined.","approval_status":"Not reviewed. Requires control-system and classification review. Automation must not override manual control.","key_parameters":[{"label":"Automated functions","value":"To be defined","basis":"tbd"},{"label":"Manual override","value":"Required for all automated functions","basis":"target"}],"risks":["Automation scope is undefined, so failure behaviour cannot be analysed."],"related_decks":[]},{"id":"guest-services","domain":"hospitality-guest","name":"Guest services","status":"concept","safety_critical":false,"public_release":false,"summary":"Guest request handling, concierge and housekeeping. Proposed for a separate guest application; not yet confirmed as in scope for this repository.","approval_status":"Not designed. Scope decision pending.","key_parameters":[{"label":"Request channels","value":"To be determined","basis":"tbd"}],"risks":["Guest data is personal data and needs a backend, which this static app does not have."],"related_decks":[]},{"id":"dining-service","domain":"hospitality-guest","name":"Dining service","status":"concept","safety_critical":false,"public_release":false,"summary":"Dining service across the Main salon, Aft Lido and bar. Proposed for a separate guest application; not yet confirmed as in scope.","approval_status":"Not designed. Scope decision pending.","key_parameters":[{"label":"Dining venues","value":"Main salon, Aft Lido, bar (concept)","basis":"model"},{"label":"Menu and service model","value":"To be determined","basis":"tbd"}],"risks":["Service routes between galley and venues are not yet checked."],"related_decks":["Main / Master","Commander / Lido"]},{"id":"booking-reservations","domain":"hospitality-guest","name":"Booking and reservations","status":"concept","safety_critical":false,"public_release":false,"summary":"Reservations for dining and experiences. Proposed for a separate guest application because it needs accounts, payments and personal data.","approval_status":"Not designed. Scope decision pending. Payments and personal data need a separate review.","key_parameters":[{"label":"Booking system","value":"To be determined","basis":"tbd"},{"label":"Payments","value":"Not in scope for this repository","basis":"tbd"}],"risks":["Personal and payment data are outside what a static app can hold securely."],"related_decks":[]},{"id":"bay-dinner-for-two","domain":"hospitality-guest","name":"Dinner for two in the bay","status":"concept","safety_critical":false,"public_release":false,"summary":"A private dinner for two served in the bay. Proposed experience only; service location, tender and safety arrangements are not designed.","approval_status":"Not designed. Requires operational and safety review of tender and bay use.","key_parameters":[{"label":"Service location","value":"Bay (concept)","basis":"model"},{"label":"Service support","value":"Tender or platform (to be defined)","basis":"tbd"}],"risks":["Bay service needs safe access and weather limits, not yet defined.","Booking depends on the separate guest application."],"related_decks":[]},{"id":"guest-apps","domain":"hospitality-guest","name":"Guest apps and guest experience","status":"concept","safety_critical":false,"public_release":false,"summary":"Guest-facing app for information, requests and bookings. Proposed for a separate project; not part of this repository.","approval_status":"Not designed. Scope decision pending.","key_parameters":[{"label":"Platform","value":"To be determined","basis":"tbd"},{"label":"Connection to onboard network","value":"Via separate guest network (to be defined)","basis":"tbd"}],"risks":["App depends on backend services and the onboard network, neither of which exists yet."],"related_decks":[]}];
const domains=[{"id":"power-propulsion","label":"Power & propulsion","description":"Electric propulsion, energy storage, generation and backup power."},{"id":"fluids-fuel","label":"Fluids & fuel","description":"Water production, potable water, plumbing, fuel handling and processing."},{"id":"environmental","label":"Environmental","description":"Wastewater, waste processing and compaction, food waste and landfill management."},{"id":"mechanical-structure","label":"Mechanical & structure","description":"HVAC, food storage, tween deck accommodation, anchor and sail systems."},{"id":"interiors","label":"Interiors","description":"Kitchen and bathroom accommodation, lighting, curated art and glassware storage."},{"id":"navigation-comms","label":"Navigation & comms","description":"Navigation, communications, ship communications, command and control, A/V media and wifi."},{"id":"security-operations","label":"Security & operations","description":"Premise security, keycards, policies and procedures, checklists and onboard automation."},{"id":"hospitality-guest","label":"Hospitality & guest","description":"Guest services, dining, booking and guest experience. Operational product scope, not yet designed."}];
const checklists=[{"id":"hv-lockout-draft","system":"propulsion-600v","title":"High-voltage lockout before entry (draft)","status":"draft","steps":[{"text":"Confirm the work scope and the equipment to be isolated.","critical":false},{"text":"Open and lock every high-voltage isolator for the equipment, following the approved procedure.","critical":true},{"text":"Test for absence of voltage at the point of work with a rated tester.","critical":true},{"text":"Apply personal locks and tags, and record who holds each lock.","critical":true},{"text":"Earth and short the conductors where the approved procedure requires it.","critical":true}]},{"id":"battery-isolation-draft","system":"battery-storage","title":"Battery bank isolation check (draft)","status":"draft","steps":[{"text":"Confirm the battery bank is isolated from charging and load sources.","critical":true},{"text":"Check the ventilation and fire-detection status of the battery space.","critical":true},{"text":"Record the state of charge and any alarms before entry.","critical":false}]},{"id":"potable-water-sample-draft","system":"water-makers","title":"Potable water sample check (draft)","status":"draft","steps":[{"text":"Take a sample from the outlet selected for testing, following the approved sampling procedure.","critical":false},{"text":"Test for the parameters set by the applicable potable water standard.","critical":true},{"text":"Record results and the action taken if a limit is exceeded.","critical":true}]}];
const sections=['INTRODUCTION','EXTERIOR','LIVING','OPERATIONS','TECHNICAL','FABRICATION','OPEN SOURCE'];

const processes=[['01','Loft & validate','Locked hull geometry, weight model, stability, structural scantlings and external review.'],['02','Develop & nest','Approved plate developments; material grades, thickness, forming allowances, cut IDs.'],['03','Cut & mark','Certified traceability, controlled kerf and cut tolerances, documented first-article tests.'],['04','Fit, weld, survey','Controlled assembly, approved welding procedures, inspection, NDT and distortion correction.'],['05','Commission & publish','As-built scans, inclining and trials; rights-cleared data release with design limitations.']];
const state={active:0,mode:'story',showNav:window.innerWidth>690,notes:true,index:false,deck:0,zoom:1,gates:new Set(),lightbox:false,domain:'all',system:null};
const A=f=>'public/assets/'+f;const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ico=(id)=>({'story':'◧','decks':'▤','fabrication':'⚙','register':'☷'}[id]||'');
function render(){let s=slides[state.active];let groups=sections.map(sec=>({sec,items:slides.map((v,i)=>({...v,i})).filter(d=>d.section===sec)}));
document.getElementById('app').innerHTML=`<div class="studio" id="presentation-root"><header class="masthead"><div class="mark"><span class="compass">✧</span><div><div class="wordmark">P68 <b>KETCH</b></div><div class="word-sub">OCEAN ARCHITECTURE STUDIO · 68 M / 223 FT</div></div></div><div class="head-controls"><span class="status">CONCEPT DESIGN <em>REV 02</em></span><button data-action="nav" aria-label="Show chapters">☰</button><button data-action="fullscreen" aria-label="Fullscreen">⛶</button></div></header><div class="workspace">${state.showNav?`<aside class="sidebar"><div class="nav-label">COLLECTION <span>${slides.length} STUDIES</span></div><div class="nav-scroll"><div class="nav-special">${[['story','Presentation'],['decks','Deck explorer'],['fabrication','Fabrication workflow'],['register','Design register'],['systems','Systems register']].map(d=>`<button class="mode ${state.mode===d[0]?'chosen':''}" data-mode="${d[0]}"><span>${ico(d[0])}</span>${d[1]}</button>`).join('')}</div><div class="rule"></div>${groups.map(g=>`<div class="nav-group"><div class="group-label">${g.sec}</div>${g.items.map(d=>`<button class="chapter ${state.active===d.i&&state.mode==='story'?'sel':''}" data-go="${d.i}"><span class="num">${String(d.i+1).padStart(2,'0')}</span>${esc(d.label)}</button>`).join('')}</div>`).join('')}</div><div class="side-footer"><div class="side-small">DESIGN AUTHORITY</div>Professional verification required before construction or CNC cutting.</div></aside>`:''}<main class="main"><div class="tools"><span class="crumb">P68 / ${state.mode==='story'?esc(s.section+' / '+s.label.toUpperCase()):state.mode.toUpperCase()}</span><div class="tool-right"><span class="tech-pill">68.0 M · STEEL HULL · KETCH</span><button title="Design notes" data-action="notes">ⓘ</button><button title="Chapter overview" data-action="index">▦</button></div></div>${state.mode==='story'?story(s):state.mode==='decks'?deckView():state.mode==='fabrication'?fabView():state.mode==='systems'?sysView():regView()}${state.index?indexView():''}${state.lightbox?lightboxView():''}</main></div><footer class="app-footer"><span>OCEAN. FREEDOM. PURPOSE.</span><span>CONCEPT DESIGN / ENGINEERING VALIDATION PENDING</span></footer></div>`;
}
function story(s){return `<div class="slide slide-${esc(s.layout)}"><div class="slide-photo"><img src="${A(s.image)}" class="large-render" data-action="zoom" alt="${esc(s.label)} concept image"><div class="photo-shade"></div><div class="photo-label">CONCEPT ASSET / FULL RESOLUTION</div></div><div class="slide-copy"><div class="eyebrow">${esc(s.tag)}</div><h1>${esc(s.title)}</h1><p class="subtitle">${esc(s.subtitle)}</p><div class="accent-rule"></div><p class="copy-body">${esc(s.body)}</p>${state.notes?`<div class="design-notes"><strong>DESIGN NOTES</strong>${s.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}</div>`:''}</div><div class="folio">P68 KETCH / INTERACTIVE LOOKBOOK <span>${String(state.active+1).padStart(2,'0')} — ${String(slides.length).padStart(2,'0')}</span></div></div><div class="under-slide"><div class="progress"><span style="width:${100*(state.active+1)/slides.length}%"></span></div><div class="transport"><button data-action="prev" ${state.active===0?'disabled':''}>‹ PREVIOUS</button><span>Use ← and → to explore</span><button data-action="next" ${state.active===slides.length-1?'disabled':''}>NEXT ›</button></div></div>`}
function deckView(){let d=decks[state.deck];return `<section class="deck-explorer"><div class="explorer-head"><span class="eyebrow">GENERAL ARRANGEMENT / PROVISIONAL</span><h1>Architecture by deck.</h1><p>Choose a level to review spaces, circulation and preliminary elevations.</p></div><div class="deck-pills">${decks.map((v,i)=>`<button class="${i===state.deck?'active':''}" data-deck="${i}">${esc(v.name)}</button>`).join('')}</div><div class="deck-frame"><div class="deck-visual"><img data-action="zoom" src="${A(d.img)}" style="transform:scale(${state.zoom})" alt="Conceptual ${esc(d.name)} plan"><span class="plan-scale">CONCEPT BLOCKING · NOT APPROVED FOR CONSTRUCTION</span></div><div class="deck-info"><span class="eyebrow">LEVEL ${String(state.deck+1).padStart(2,'0')}</span><h2>${esc(d.name)}</h2><div class="datum">${esc(d.elevation)}<small> FLOOR DATUM / DWL</small></div><p>${esc(d.zone)}</p><div class="rooms">${d.rooms.map((r,i)=>`<div><span>${String(i+1).padStart(2,'0')}</span>${esc(r)}</div>`).join('')}</div><div class="access">VERTICAL CONNECTION <b>${esc(d.access)}</b></div></div></div><div class="mini-actions"><button data-action="minus">− Zoom out</button><button data-action="plus">+ Zoom in</button><button data-go="13">OPEN DRAWINGS ↗</button></div></section>`}
function fabView(){return `<section class="fabrication"><div class="explorer-head"><span class="eyebrow">DIGITAL-TO-PHYSICAL / STEEL HULL</span><h1>A hull, made traceable.</h1><p>Plasma cutting is only one step. Safe production depends on engineered plate forming, welding, inspection and as-built records.</p></div><div class="scale-callout"><span>DESIGN SCALE</span><b>68 m <em>/</em> 223 ft</b><p>Not the 68-foot, 40-tonne vessel in the community proposal.</p></div><div class="processes">${processes.map((p,i)=>`<button data-gate="${i}" class="process ${state.gates.has(i)?'done':''}"><span class="process-id">${state.gates.has(i)?'✓':p[0]}</span><div><strong>${esc(p[1])}</strong><p>${esc(p[2])}</p></div></button>`).join('')}</div><div class="footnote">Marking a phase here records a local presentation review only, not engineering approval.</div></section>`}
function regView(){let m=[['68.0 m','LOA / INTENT'],['62.0 m','LWL / MODEL'],['12.1 m','MAX BEAM / MODEL'],['786.3 m³','CANOE-BODY VOLUME'],['~806 t','BUOYANCY / SW'],['60 days','AUTONOMY TARGET']];return `<section class="register"><div class="explorer-head"><span class="eyebrow">DESIGN GOVERNANCE / P68-KETCH</span><h1>Design register.</h1><p>Fixed intent, provisional geometry and unverified performance are deliberately kept distinct.</p></div><div class="metrics">${m.map(d=>`<div class="metric"><b>${d[0]}</b><span>${d[1]}</span></div>`).join('')}</div><div class="review-box"><h3>Release boundaries</h3><div><strong>Concept</strong><span>Open studies and visual design material; not fabrication authority.</span></div><div><strong>Reviewed</strong><span>Engineering and class-reviewed files, with named rules and revisions.</span></div><div><strong>As-built</strong><span>Fabrication records, inspections, trials, deviations and source geometry.</span></div></div></section>`}
function sysView(){
 const list=state.domain==='all'?systems:systems.filter(s=>s.domain===state.domain);
 const cur=list.find(s=>s.id===state.system)||list[0];
 const dl=id=>(domains.find(d=>d.id===id)||{}).label||id;
 const sl={concept:'Concept',reviewed:'Reviewed','as-built':'As-built'};
 const bl={target:'Design target',model:'Model value',tbd:'To be determined'};
 const pill=(id,label,n)=>'<button class="'+(state.domain===id?'active':'')+'" data-domain="'+esc(id)+'">'+esc(label)+' ('+n+')</button>';
 const rows=list.map(s=>'<button class="system-row '+(cur&&cur.id===s.id?'sel':'')+'" data-system="'+esc(s.id)+'"><span>'+esc(s.name)+'</span><small>'+sl[s.status]+(s.safety_critical?' · safety-critical':'')+'</small></button>').join('');
 const detail=cur?`<article class="system-detail"><span class="eyebrow">${esc(dl(cur.domain))}</span><h2>${esc(cur.name)}</h2>
<div class="system-flags">${cur.safety_critical?'<span class="flag warn">Safety-critical</span>':''}${cur.public_release?'':'<span class="flag">Not for public release</span>'}<span class="flag">${sl[cur.status]}</span></div>
<p class="system-summary">${esc(cur.summary)}</p>
<div class="approval"><strong>APPROVAL</strong> ${esc(cur.approval_status)}</div>
<h3>Key parameters</h3><div class="param-list">${cur.key_parameters.map(p=>'<div class="param"><span>'+esc(p.label)+'</span><b>'+esc(p.value)+'</b><em>'+bl[p.basis]+'</em></div>').join('')}</div>
<h3>Open risks</h3><ul class="risk-list">${cur.risks.map(r=>'<li>'+esc(r)+'</li>').join('')}</ul>
${checklists.filter(c=>c.system===cur.id).map(c=>'<div class="checklist"><h3>'+esc(c.title)+'</h3><span class="flag warn">Draft, not for use on a vessel</span><ol>'+c.steps.map(st=>'<li class="'+(st.critical?'critical':'')+'">'+(st.critical?'<b>CRITICAL </b>':'')+esc(st.text)+'</li>').join('')+'</ol></div>').join('')}
<div class="access">RELATED DECKS <b>${cur.related_decks.length?cur.related_decks.map(x=>esc(x)).join(', '):'Not yet placed on the general arrangement'}</b></div></article>`:'';
 return `<section class="systems-explorer"><div class="explorer-head"><span class="eyebrow">SYSTEMS REGISTER / CONCEPT STAGE</span><h1>Systems by domain.</h1><p>Each system separates what is known, what is a design target and what is still to be determined. Nothing here is reviewed or approved.</p></div><div class="deck-pills">${pill('all','All',systems.length)}${domains.map(d=>pill(d.id,d.label,systems.filter(s=>s.domain===d.id).length)).join('')}</div><div class="systems-frame"><div class="systems-list">${list.length?'':'<p class="systems-empty">No systems registered in this domain yet.</p>'}${rows}</div>${detail}</div></section>`;
}
function indexView(){return `<div class="index-backdrop" data-action="closeindex"><div class="index-dialog"><div class="index-title"><h2>All chapters</h2><button data-action="closeindex">CLOSE ×</button></div><div class="tiles">${slides.map((s,i)=>`<button data-go="${i}"><img src="${A(s.image)}" alt=""><small>${String(i+1).padStart(2,'0')} / ${esc(s.section)}</small><strong>${esc(s.label)}</strong></button>`).join('')}</div></div></div>`}
function lightboxView(){return `<div class="lightbox" data-action="closezoom"><button data-action="closezoom">CLOSE ×</button><img src="${A(state.mode==='decks'?decks[state.deck].img:slides[state.active].image)}" alt="Expanded concept image"></div>`}
function go(n){state.active=Math.min(slides.length-1,Math.max(0,n));state.mode='story';state.index=false;state.lightbox=false;render()}
function dispatch(e){let b=e.target.closest('[data-action], [data-go], [data-mode], [data-deck], [data-gate], [data-domain], [data-system]');if(!b)return;let ds=b.dataset;if(ds.go!==undefined){go(Number(ds.go));return}if(ds.mode){state.mode=ds.mode;state.index=false;render();return}if(ds.deck!==undefined){state.deck=Number(ds.deck);state.zoom=1;render();return}if(ds.domain!==undefined){state.domain=ds.domain;state.system=null;render();return}if(ds.system!==undefined){state.system=ds.system;render();return}if(ds.gate!==undefined){let n=Number(ds.gate);state.gates.has(n)?state.gates.delete(n):state.gates.add(n);render();return}let a=ds.action;switch(a){case'prev':go(state.active-1);return;case'next':go(state.active+1);return;case'nav':state.showNav=!state.showNav;break;case'notes':state.notes=!state.notes;break;case'index':state.index=!state.index;break;case'closeindex':if(e.target.closest('.index-dialog')&&!e.target.closest('button'))return;state.index=false;break;case'zoom':state.lightbox=true;break;case'closezoom':state.lightbox=false;break;case'plus':state.zoom=Math.min(2,state.zoom+.2);break;case'minus':state.zoom=Math.max(1,state.zoom-.2);break;case'fullscreen':{let el=document.getElementById('presentation-root');if(!document.fullscreenElement){el.requestFullscreen?.()}else{document.exitFullscreen?.()}return;}}render()}
document.addEventListener('click',dispatch);document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight')go(state.active+1);if(e.key==='ArrowLeft')go(state.active-1);if(e.key==='Escape'){state.lightbox=false;state.index=false;render()}});render();
</script></body></html>
